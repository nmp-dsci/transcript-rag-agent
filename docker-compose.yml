# Local infrastructure for the GraphRAG knowledge graph (P4).
#
#   docker compose up -d neo4j
#
# Neo4j was chosen over networkx/Postgres in the s05 review: the graph is
# derived and rebuildable (re-run `index-graph`), so the store carries no
# irreplaceable state — the volume just avoids re-extracting on restart.
services:
  neo4j:
    image: neo4j:5
    container_name: yt-agent-neo4j
    ports:
      - "7474:7474" # HTTP browser UI
      - "7687:7687" # Bolt driver
    environment:
      # Override via NEO4J_PASSWORD in the environment; keep in sync with ~/.env.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-yt-agent-graph}
    volumes:
      - ./.yt-agent/neo4j/data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
